<!--Estrutura da aplicação TaskFlow-->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
         content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body> 
    <main class="container">
       
        <h1>TaskFlow</h1>

        <p>Organize suas tarefas diarias</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Digite uma nova tarefa"
                required
            >
            <button type="submit">
                Adicionar
            </button>
            
        </form>

        <ul id="task-list"></ul>

    </main>
</body>
